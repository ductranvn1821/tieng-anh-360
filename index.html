<style>
/* Layout: a study planner. Today's lesson card first, a 12×30 year grid as the signature, lessons as one long worksheet. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF3; --ink:#0B1220; --muted:#3F4A5B; --line:#D8DEE7;
  --accent:#3346C9; --accent-ink:#FFFFFF; --accent-soft:#E2E6FB;
  --mark:#C98510; --mark-soft:#FBEFD6;
  --good:#167A42; --good-soft:#D3EEDD; --bad:#C62A1A; --bad-soft:#FBDCD7; --res-ink:#FFFFFF;
  --font-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --font-body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --font-ipa:"Noto Sans","Segoe UI","Arial Unicode MS",sans-serif;
  --r:12px; --navh:0px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --surface-2:#1F2835; --ink:#E7EBF1; --muted:#9AA5B5; --line:#2B3544;
  --accent:#8F9DFF; --accent-ink:#0E131A; --accent-soft:#242D50;
  --mark:#F0B54A; --mark-soft:#3A2F17;
  --good:#52C588; --good-soft:#15301F; --bad:#F27D6C; --bad-soft:#3B1E1A; --res-ink:#0E131A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --surface-2:#1F2835; --ink:#E7EBF1; --muted:#9AA5B5; --line:#2B3544;
  --accent:#8F9DFF; --accent-ink:#0E131A; --accent-soft:#242D50;
  --mark:#F0B54A; --mark-soft:#3A2F17;
  --good:#52C588; --good-soft:#15301F; --bad:#F27D6C; --bad-soft:#3B1E1A; --res-ink:#0E131A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:1.7rem;font-weight:700} h2{font-size:1.25rem;font-weight:600} h3{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header + nav */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.08rem;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:.74rem;color:var(--muted);letter-spacing:0}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs a{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);padding:7px 11px;border-radius:999px;font-weight:500;font-size:.92rem}
.tabs a svg{width:18px;height:18px;flex:none}
.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tabs.bottom{display:none}
@media (max-width:720px){
  :root{--navh:calc(62px + env(safe-area-inset-bottom,0px))}
  .tabs.side{display:none}
  .tabs.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;margin:0;z-index:40;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabs.bottom a{flex-direction:column;gap:2px;font-size:.68rem;padding:4px 6px;border-radius:10px;min-width:58px}
  .tabs.bottom a svg{width:21px;height:21px}
}
.who{cursor:pointer;background:var(--accent-soft,transparent);color:var(--ink);font:inherit;font-size:.78rem}
.sync{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
main{padding-block:20px calc(40px + var(--navh))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:.86rem}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{background:transparent;border-style:dashed}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.daynum{font-family:var(--font-display);font-weight:700;line-height:1;font-size:3.2rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.daynum small{font-size:1rem;color:var(--muted);font-weight:500;letter-spacing:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.mark{background:var(--mark-soft);color:var(--mark)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;min-height:42px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:var(--surface-2);border-color:transparent;color:var(--ink)}
.btn.sm{padding:5px 11px;min-height:34px;font-size:.88rem;border-radius:8px}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn.live{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.btn.live{animation:none}}

[hidden]{display:none!important}
label.field{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:500;color:var(--muted);min-width:0}
.row>label.field{flex:1 1 200px}
input[type=text],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);font-size:1rem}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

/* week strip & year grid */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dchip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:7px 2px;cursor:pointer;min-width:0;font-variant-numeric:tabular-nums}
.dchip b{font-family:var(--font-display);font-size:1rem}
.dchip span{font-size:.62rem;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dchip.done{background:var(--good-soft);border-color:transparent}
.dchip.done span{color:var(--good)}
.dchip.low{background:var(--mark-soft)} .dchip.low span{color:var(--mark)}
.dchip.now{border:2px solid var(--accent);background:var(--accent-soft)}
.dchip.now span{color:var(--accent)}
.dchip.lock{opacity:.55}
.year{display:grid;grid-template-columns:28px repeat(30,minmax(0,1fr));gap:3px;align-items:center}
.year .ml{font-size:.68rem;color:var(--muted);font-weight:600}
.cell{aspect-ratio:1;border-radius:3px;background:var(--surface-2);max-width:100%;border:0;padding:0;cursor:default}
.cell.s1{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
.cell.s2{background:color-mix(in srgb,var(--accent) 55%,var(--surface-2))}
.cell.s3{background:color-mix(in srgb,var(--accent) 80%,var(--surface-2))}
.cell.s4{background:var(--accent)}
.cell.now{outline:2px solid var(--mark);outline-offset:1px}
.cell.click{cursor:pointer}
.legend{display:flex;gap:6px;align-items:center;font-size:.74rem;color:var(--muted)}
.legend .cell{width:12px;height:12px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--font-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.bar em{font-style:normal;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}

/* roadmap */
details.month{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.month>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
details.month>summary::-webkit-details-marker{display:none}
details.month>summary .mno{font-family:var(--font-display);font-weight:700;color:var(--accent);min-width:2.4em}
details.month>summary .prog{margin-left:auto;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
details.month[open]>summary{border-bottom:1px solid var(--line)}
.mbody{padding:14px 16px;display:flex;flex-direction:column;gap:16px}
.wk{display:flex;flex-direction:column;gap:8px}
.wk .wt{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.wk .wt b{font-family:var(--font-display);font-weight:600}
.phase{font-family:var(--font-display);font-weight:600;color:var(--muted);font-size:.9rem;margin-top:8px}
.rhythm{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.rhythm div{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:.85rem}
.rhythm div b{display:block;font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* lesson */
.lesson-head{display:flex;flex-direction:column;gap:8px}
.block{display:flex;flex-direction:column;gap:10px}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:16px 18px}
.note.sec{border-left-color:var(--mark);background:transparent;border-style:none none none solid;border-radius:0;padding:4px 0 4px 14px}
.ex{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px dashed var(--line)}
.ex:first-of-type{border-top:0}
.ex .vi{color:var(--muted);font-size:.9rem}
.reading{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;max-width:68ch}
.reading p{margin:0 0 .8em} .reading p:last-child{margin:0}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.vcard .w{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vcard .w b{font-family:var(--font-display);font-size:1.15rem;font-weight:600}
.ipa{font-family:var(--font-ipa);color:var(--accent);font-size:.95rem}
.pos{font-size:.75rem;color:var(--muted);font-style:italic}
.vcard .mean{font-weight:600}
.hide-mean .vcard:not(.peek) .mean,.hide-mean .vcard:not(.peek) .exvi{filter:blur(6px);user-select:none;cursor:pointer}
.col{display:flex;gap:4px;flex-wrap:wrap}
.col span{font-size:.78rem;background:var(--surface-2);border-radius:6px;padding:2px 7px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.q .qh{display:flex;gap:10px;align-items:flex-start}
.q .qn{flex:none;font-family:var(--font-display);font-weight:600;color:var(--muted);font-size:.85rem;min-width:2em;padding-top:2px;font-variant-numeric:tabular-nums}
.q .qt{flex:1;min-width:0;font-weight:600}
.q.ok{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.q.no{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;cursor:pointer;min-height:44px}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent);font-weight:700}
.opt.right,.opt.wrong{color:var(--res-ink);font-weight:700;opacity:1}
.opt.right{border-color:var(--good);background:var(--good)} .opt.right::before{content:"✓ "}
.opt.wrong{border-color:var(--bad);background:var(--bad)} .opt.wrong::before{content:"✗ "}
input:disabled,textarea:disabled{color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1;font-weight:600}
input.res-ok,.built.res-ok{border:2px solid var(--good);background:var(--good-soft)}
input.res-no,.built.res-no{border:2px solid var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.pool,.built{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:6px;border-radius:10px}
.built{border:1px dashed var(--line);background:var(--surface-2)}
.wchip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer}
.wchip:hover{border-color:var(--accent)}
.built .wchip{background:var(--accent-soft);border-color:var(--accent);font-weight:700;color:var(--ink)}
.fb{border-radius:10px;padding:10px 12px;font-size:.92rem;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-soft);border-left:5px solid var(--good)} .fb.no{background:var(--bad-soft);border-left:5px solid var(--bad)} .fb.info{background:var(--surface-2)}
.fb .lbl{font-weight:700} .fb.ok .lbl{color:var(--good)} .fb.no .lbl{color:var(--bad);font-size:1rem}
.fb.no b{color:var(--good);font-weight:800}
.err{display:flex;flex-direction:column;gap:2px;padding:6px 0;border-top:1px dashed color-mix(in srgb,var(--ink) 18%,transparent)}
.err:first-child{border-top:0}
.err s{color:var(--bad);font-weight:600} .err ins{color:var(--good);text-decoration:none;font-weight:600}
.diff span{padding:0 1px}
.diff .miss{color:var(--bad);text-decoration:underline wavy;font-weight:600}
.diff .hit{color:var(--good)}
.player{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.script{white-space:pre-line;background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:.95rem}
.pron{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.pron .s{font-family:var(--font-display);font-size:1.12rem;font-weight:500}
.pron dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin:4px 0 0;font-size:.9rem}
.pron dt{color:var(--muted);font-weight:600} .pron dd{margin:0;min-width:0}
.submitbar{position:sticky;bottom:calc(var(--navh) + 8px);z-index:15;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.submitbar .grow{flex:1;min-width:0}
.scorebig{font-family:var(--font-display);font-weight:700;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.live-txt{font-size:.85rem;color:var(--muted);font-style:italic}
.wc{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* chat */
.chatlog{display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(560px,92%);display:flex;flex-direction:column;gap:6px}
.msg .bub{border-radius:14px;padding:10px 13px}
.msg.t{align-self:flex-start} .msg.t .bub{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.msg.u{align-self:flex-end} .msg.u .bub{background:var(--accent);color:var(--accent-ink);border-top-right-radius:4px}
.msg .tr{font-size:.86rem;color:var(--muted)}
.composer{position:sticky;bottom:calc(var(--navh) + 8px);display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.composer textarea{min-height:46px;max-height:160px;border:0;box-shadow:none;padding:8px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 16px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(var(--navh) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.confirm{display:flex;flex-direction:column;gap:8px;background:var(--bad-soft);border-radius:10px;padding:12px}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
</style>

function plan(day){
  const m = Math.ceil(day/30), dIn = (day-1)%30+1, M = MONTHS[m-1];
  let w, type;
  if (dIn <= 28){ w = Math.ceil(dIn/7); type = WEEK_ORDER[(dIn-1)%7]; }
  else { w = 4; type = dIn === 29 ? "monthReview" : "monthTest"; }
  const W = M.weeks[w-1];
  return {day, m, w, dIn, weekNo:(m-1)*4+w, type, M, sub_vi:W[0], sub_en:W[1], grammar:W[2], can:W[3]};

const $ = (s, r=document) => r.querySelector(s);
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)){ if (c == null || c === false) continue; el.append(c.nodeType ? c : String(c)); }
  return el;
}
function rich(t){
  const f = document.createDocumentFragment();
  String(t ?? "").split("\n").forEach((line, li) => {
    if (li) f.append(h("br"));
    line.split(/(\*\*[^*]+\*\*)/).forEach(seg => {
      if (/^\*\*[^*]+\*\*$/.test(seg)) f.append(h("b", null, seg.slice(2,-2))); else if (seg) f.append(seg);
    });
  });
  return f;
}

const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const daysBetween = (a,b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const fmtVN = s => { const d = parseYmd(s); return d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear(); };

function deepMerge(t, s){ for (const [k,v] of Object.entries(s)){ if (isObj(v) && isObj(t[k])) deepMerge(t[k], v); else t[k] = isObj(v) ? deepMerge({}, v) : v; } return t; }

let toastT;
function toast(msg, ms=3200){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_,rej) => setTimeout(() => rej({code:"timeout"}), ms))]);

const CONTR = [[/\bwon't\b/g,"will not"],[/\bcan't\b/g,"can not"],[/\bcannot\b/g,"can not"],[/\bshan't\b/g,"shall not"],[/n't\b/g," not"],[/'re\b/g," are"],[/'ve\b/g," have"],[/'ll\b/g," will"],[/'m\b/g," am"],[/'d\b/g," would"]];
function norm(s){
  let x = String(s ?? "").toLowerCase().replace(/[’‘`´]/g,"'");
  for (const [re,r] of CONTR) x = x.replace(re, r);
  return x.replace(/[^a-z0-9'\s-]/g," ").replace(/-/g," ").replace(/\s+/g," ").trim();
}
const words = s => norm(s).split(" ").filter(Boolean);
function lcsHits(a, b){
  const n=a.length, m=b.length, dp = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const hit = new Array(n).fill(false); let i=0, j=0;
  while (i<n && j<m){ if (a[i]===b[j]){ hit[i]=true; i++; j++; } else if (dp[i+1][j] >= dp[i][j+1]) i++; else j++; }
  return {hit, len:dp[0][0]};
}
/* compare spoken/typed text against a target; returns score 0..1 and per-token hits for display */
function compareText(target, said){
  const tokens = String(target).split(/\s+/).filter(Boolean);
  const a = [], owner = [];
  tokens.forEach((t,ti) => words(t).forEach(w => { a.push(w); owner.push(ti); }));
  const b = words(said);
  const {hit, len} = lcsHits(a, b);
  const tokHit = tokens.map((_,ti) => owner.every((o,k) => o !== ti || hit[k]));
  const score = (a.length + b.length) ? (2*len)/(a.length + b.length) : 0;
  return {score, tokens, tokHit};
}
const matchAny = (ans, accepted) => { const n = norm(ans); return !!n && [].concat(accepted||[]).some(x => norm(x) === n); };
const wordCount = s => (String(s||"").trim().match(/\S+/g) || []).length;

const Store = {
  mode:"local", db:null, base:null, q:{},
  async init(){
    if (!window.claude?.use) return;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (db && user){ const id = await user.id(); if (id){ this.db = db; this.base = "data/users/" + id; this.mode = "cloud"; } }
    } catch (e) { console.warn("db init", e); }
  },
  ref(k){ return this.db.doc(this.base + "/" + pk(k)); },
  async get(k){
    if (this.mode === "cloud"){
      try { const s = await withTimeout(this.ref(k).get(), 12000); const v = s.exists ? s.data() : null; if (v) lsSet(k, v); return v; }
      catch (e){ console.warn("get", k, e); toast("Chưa kết nối được kho lưu trữ, đang dùng bản lưu trên máy."); return lsGet(k); }
    }
    return lsGet(k);
  },
  chain(k, fn){ const p = (this.q[k] || Promise.resolve()).then(fn, fn); this.q[k] = p.catch(() => {}); return p; },
  async set(k, v){
    lsSet(k, v);
    if (this.mode !== "cloud") return;
    return this.chain(k, () => this.ref(k).set(v)).catch(e => { console.warn("set", e); toast("Chưa lưu lên tài khoản được, dữ liệu vẫn còn trên máy này."); });
  },
  async patch(k, p){
    const cur = lsGet(k) || {}; lsSet(k, deepMerge(cur, p));
    if (this.mode !== "cloud") return;
    return this.chain(k, () => this.ref(k).update(p)).catch(e => { console.warn("update", e); toast("Chưa lưu lên tài khoản được, dữ liệu vẫn còn trên máy này."); });
  }
};

const Voice = {
  t:null, synth:null, stopFlag:false,
  async init(){
    if (window.claude?.use) try { this.t = await claude.use("tts"); } catch {}
    if ("speechSynthesis" in window){ this.pick(); speechSynthesis.onvoiceschanged = () => this.pick(); }
  },
  pick(){
    const vs = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
    const score = v => (/natural|online|google/i.test(v.name)?2:0) + (/en[-_]US/i.test(v.lang)?1:0);
    this.synth = vs.sort((a,b) => score(b)-score(a));
  },
  ok(){ return !!this.t || "speechSynthesis" in window; },
  async say(what, rate){
    rate = rate || S.rate;
    const lines = Array.isArray(what) ? what : [{text:what}];
    this.stopFlag = false;
    if (this.t){
      try { await this.t.speak(lines.map(l => ({text:l.text, voice:l.voice || "buttery", language:"en"})), {rate:clamp(rate,0.7,1.5)}); return; }
      catch (e){
        if (e.code === "stopped" || e.code === "busy") return;
        if (e.code === "rate_limited"){ toast("Giọng đọc đang bận, thử lại sau ít giây."); return; }
        if (e.code === "not_granted" || e.code === "unavailable") this.t = null;
        else console.warn("tts", e);
      }
    }
    if ("speechSynthesis" in window){
      speechSynthesis.cancel();
      for (const l of lines){
        if (this.stopFlag) break;
        await new Promise(res => {
          const u = new SpeechSynthesisUtterance(l.text); u.lang = "en-US"; u.rate = rate;
          const pool = this.synth || []; const idx = {airy:1, rounded:2, glassy:3}[l.voice] || 0;
          if (pool.length) u.voice = pool[Math.min(idx, pool.length-1)] || pool[0];
          u.onend = u.onerror = () => res(); speechSynthesis.speak(u);
        });
      }
      return;
    }
    toast("Thiết bị này chưa đọc được tiếng Anh.");
  },
  stop(){ this.stopFlag = true; this.t?.stop().catch(() => {}); try { speechSynthesis.cancel(); } catch {} }
};
function scriptLines(script){
  const voices = {}, pool = ["airy","rounded","glassy"];
  return String(script).split(/\n+/).map(s => s.trim()).filter(Boolean).map(s => {
    const m = s.match(/^([A-Z][A-Za-z .]{0,18}):\s*(.+)$/);
    if (!m) return {text:s, voice:"buttery"};
    if (!voices[m[1]]) voices[m[1]] = pool[Object.keys(voices).length % 3];
    return {text:m[2], voice:voices[m[1]]};
  });
}

function webSpeech(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return null;
  let rec, fin, par, st;
  return { onFinal:f => fin = f, onPartial:f => par = f, onState:f => st = f,
    start:() => new Promise((res, rej) => {
      try {
        rec = new SR(); rec.lang = "en-US"; rec.continuous = rec.interimResults = true;
        rec.onresult = e => { let t = ""; for (let k = e.resultIndex; k < e.results.length; k++){ const x = e.results[k]; if (x.isFinal) fin?.({text:x[0].transcript.trim()}); else t += x[0].transcript; } par?.({text:t}); };
        rec.onerror = e => { if (/not-allowed/.test(e.error)) rej({code:"not_granted"}); else if (!/no-speech|aborted/.test(e.error)) toast("Micro báo lỗi: " + e.error); };
        rec.onstart = res; rec.onend = () => { rec = null; st?.({state:"idle"}); };
        rec.start();
      } catch { rej({code:"unavailable"}); }
    }),
    stop:async () => { try { rec?.stop(); } catch {} } };
}

const Mic = {
  d:null, active:null, onFinal:null, onPartial:null,
  async init(){
    if (window.claude?.use) try { this.d = await claude.use("dictation"); } catch {}
    this.d ||= webSpeech();
    if (!this.d) return;
    this.d.onFinal(({text}) => this.onFinal?.(text));
    this.d.onPartial(({text}) => this.onPartial?.(text));
    this.d.onState(({state}) => { if (state === "idle") this.end(); });
  },
  button(onFinal, onPartial, label="Nói", onStart){
    if (!this.d) return null;
    const b = h("button", {type:"button", class:"btn ghost sm"}, label);
    b.dataset.label = label;
    b.addEventListener("click", () => {
      if (this.active){ this.d.stop().catch(() => {}); return; }
      this.active = b; this.onFinal = onFinal; this.onPartial = onPartial;
      onStart?.();
      this.d.start({language:"en-US"}).catch(e => {
        this.end();
        if (e.code === "not_granted"){ this.d = null; toast("Micro đã bị tắt cho trang này. Bạn gõ câu trả lời nhé."); }
        else if (e.code !== "dismissed" && e.code !== "stopped") toast("Không bật được micro (" + e.code + ").");
      });
      b.classList.add("live"); b.textContent = "Dừng";
    });
    return b;
  },
  end(){ if (this.active){ this.active.classList.remove("live"); this.active.textContent = this.active.dataset.label; this.onPartial?.(""); } this.active = null; }
};

function progressInfo(P){
  const done = P.done || {};
  let next = 1; while (next <= 360 && done[next]) next++;
  const doneN = Object.keys(done).length;
  const cal = Math.max(1, daysBetween(P.startDate, today()) + 1);
  return {done, doneN, next, cal, finished: next > 360, todayDone: next > cal && next <= 360};
}
function avg(arr){ return arr.length ? arr.reduce((a,b) => a+b, 0) / arr.length : null; }
function recentScores(P, n){ return Object.keys(P.done||{}).map(Number).sort((a,b) => a-b).slice(-n).map(d => P.done[d].s); }

function dayChip(n, P, onlyCode){
  const p = plan(n), info = P ? progressInfo(P) : null, d = P?.done?.[n];
  let cls = "dchip";
  if (d) cls += d.s >= 70 ? " done" : " low";
  else if (info && n === info.next && !info.todayDone) cls += " now";
  else cls += " lock";
  const title = "Ngày " + n + " · " + TYPES[p.type].vi + (d ? " · " + d.s + "%" : "");
  return h("button", {type:"button", class:cls, title, "aria-label":title, onclick:() => clickDay(n)},
    h("b", null, onlyCode ? TYPES[p.type].code : n), h("span", null, d ? d.s + "%" : (onlyCode ? "N" + n : TYPES[p.type].code)));
}
function clickDay(n){
  const P = S.profile; if (!P) return;
  const info = progressInfo(P);
  if (P.done?.[n]) return openDay(n, true);
  if (n === info.next && !info.todayDone) return openDay(n);
  if (n === info.next) return toast("Bài ngày " + n + " sẽ mở vào ngày mai.");
  toast("Bài ngày " + n + " dự kiến mở ngày " + fmtVN(addDays(today(), n - info.next + (info.todayDone ? 1 : 0))) + ".");
}

async function createProfile({level, why, placement}){
  const ob = lsGet("onboard") || {};
  if (!S.learners.some(l => l.id === S.learner)){ S.learners.push({id:S.learner, name:(ob.name||"").trim().slice(0,40) || "Người học " + (S.learners.length+1), created:today()}); await saveLearners(); }
  const old = S.profile;
  if (old){
    const patch = {level, levelHistory:[...(old.levelHistory||[]), {d:today(), l:level, why}]};
    if (placement) patch.placement = placement;
    if (placement?.focus) patch.focus = placement.focus;
    deepMerge(S.profile, patch); await Store.patch("profile", patch); return;
  }
  const P = {v:1, startDate:today(), level, goal:ob.goal || GOALS[0], minutes:Number(ob.minutes||30), field:ob.field||"",
    difficulty:0, done:{}, mistakes:[], streak:0, lastDate:null, levelHistory:[{d:today(), l:level, why}],
    placement:placement||null, focus:placement?.focus||[]};
  S.profile = P; await Store.set("profile", P);
}

/* ============================== LESSON GENERATION ============================== */
const SCHEMA = `OUTPUT: only one JSON object: {"title":"English title","goal_vi":"mục tiêu bài học (1 câu tiếng Việt)","blocks":[BLOCK, ...]}
BLOCK is one of:
{"kind":"note","title":"...","text_vi":"giải thích ngắn bằng tiếng Việt, **in đậm** được phép","examples":[{"en":"...","vi":"..."}],"after":false}
{"kind":"vocab","words":[{"w":"word or phrase","ipa":"/.../","pos":"n.|v.|adj.|adv.|phr.","vi":"nghĩa","ex":"example sentence","ex_vi":"dịch","col":["common collocation"],"use_vi":"cách dùng khi giao tiếp"}]}
{"kind":"reading","title":"...","text":"paragraphs separated by \\n\\n"}
{"kind":"listening","title":"...","script":"A: line\\nB: line"}
{"kind":"pron","items":[{"s":"sentence","ipa":"/.../","stress":"the sentence with STRESSED syllables in capitals","tone":"ngữ điệu (lên/xuống, ở đâu)","pitfalls_vi":"âm người Việt dễ sai","tip_vi":"mẹo luyện"}]}
{"kind":"q","type":"mcq","skill":"S","q":"...","opts":["...","..."],"ans":0,"why_vi":"..."}
{"kind":"q","type":"fill","skill":"S","q":"sentence with one ___ blank","ans":["accepted answer","other accepted form"],"hint":"optional hint","why_vi":"..."}
{"kind":"q","type":"order","skill":"S","words":["shuffled","words","of","one","sentence."],"ans":"The correct sentence.","why_vi":"..."}
{"kind":"q","type":"dict","skill":"listening","text":"a sentence to dictate (8-16 words, no digits)"}
{"kind":"q","type":"write","skill":"writing","q":"writing task","min":80,"model":"model answer","check_vi":["tiêu chí tự kiểm tra"]}
{"kind":"q","type":"speak","skill":"speaking","q":"question or situation to answer aloud","model":"model answer, 3-5 sentences","check_vi":["tiêu chí tự kiểm tra"]}
S (skill) is one of: vocab, grammar, reading, listening, writing, speaking.
A block with "after":true is shown only after the learner submits (use it for answer-revealing tips).`;

function typeSpec(p){
  const L = S.profile.level;
  const wmin = ["A1","A2"].includes(L) ? 50 : ["A2+","B1"].includes(L) ? 90 : 150;
  const weeks = p.M.weeks.map((w,i) => `Week ${i+1}: ${w[1]} (grammar: ${w[2]})`).join("; ");
  return ({
    vocab:`VOCABULARY day. Blocks: 1 short note (how to learn and use today's words, 2-3 lines), 1 vocab block with 15 useful words/phrases for the week topic (mix verbs, nouns, adjectives and collocations useful in real conversations and at work), then 10 questions: 4 mcq (meaning/usage), 4 fill (collocations in context), 2 order.`,
    grammar:`GRAMMAR day on the week's grammar focus. 1 note block: clear explanation in Vietnamese (form, use, signal words, typical mistakes of Vietnamese learners) with 5 examples set in the week topic. Then 12 questions: 5 fill, 4 mcq, 3 order. If the grammar point is below the learner's level, teach its advanced uses and nuances instead of basics.`,
    listening:`LISTENING day. 1 listening block: a natural dialogue between two speakers labelled A and B, 120-220 words depending on level, about the week topic. Then 6 mcq questions (skill listening: gist, details, inference) that do not quote the script, then 3 dict items with sentences from the dialogue. Then 1 note block with "after":true listing 5 useful expressions from the dialogue (examples en/vi).`,
    reading:`READING day. 1 reading block (180-350 words depending on level): an email, article, report or story about the week topic. Then 6 questions about the text (mcq; include 2 True/False/Not Given as mcq with opts ["True","False","Not Given"]), 3 vocabulary-in-context questions (mcq or fill), then 1 note block with "after":true explaining 5 useful phrases from the text.`,
    speaking:`SPEAKING & PRONUNCIATION day. 1 pron block with 6 sentences on the week topic targeting sounds Vietnamese speakers often get wrong (final consonants, /θ ð/, /ʃ ʒ/, /r l/, consonant clusters, word stress, linking). 1 note block with useful phrases for today's speaking situations (examples en/vi). Then 2 mcq on word stress or pronunciation (skill speaking), then 4 speak questions: 2 personal questions and 2 workplace role-play situations, each answerable in 3-6 sentences.`,
    writing:`WRITING day. 1 note block: a short model text (email, paragraph or report of 80-150 words related to the week topic, given as one "en" example with its "vi" translation) plus structure and useful phrases explained in Vietnamese. Then 4 fill questions (linking words / formal phrases), 2 order, then 1 write task of at least ${wmin} words about a realistic situation for the week topic.`,
    weekReview:`WEEKLY REVIEW of this week (topic, vocabulary, grammar) plus the learner's recent mistakes. 1 note block (4-5 key points of the week in Vietnamese). Then: 5 vocab questions (mcq/fill), 5 grammar questions (fill/order), 1 reading block of about 120 words followed by 2 mcq, 1 dict, 1 speak, 1 write (min 50 words).`,
    monthReview:`MONTHLY REVIEW of the month "${p.M.en}". ${weeks}. 1 note block summarising the month's grammar in Vietnamese with examples, then 20 mixed questions (mcq, fill, order) covering all four weeks evenly, plus 1 speak.`,
    monthTest:`MONTHLY TEST for the month "${p.M.en}". ${weeks}. No teaching notes before the questions. 1 reading block (about 200 words) + 4 mcq, 1 listening block (dialogue of about 150 words) + 4 mcq, 6 grammar questions, 6 vocab questions, 1 dict, 1 write (min ${Math.max(60,wmin)} words), 1 speak. At the end, 1 note block with "after":true giving study advice for next month.`,
    extra:`PERSONAL MISTAKE REVIEW. 1 note block explaining in Vietnamese the main error patterns found in the learner's mistakes, then 12 questions (mcq, fill, order) that target exactly those patterns, in new sentences.`
  })[p.type];
}
function lessonPrompt(p){
  const P = S.profile;
  const diff = P.difficulty > 0 ? " (scores are high: make it noticeably harder)" : P.difficulty < 0 ? " (scores are low: make it a bit easier with more support)" : "";
  const mist = (P.mistakes||[]).slice(-15).map(m => `- [${m.t}] ${m.q} → correct: ${m.a}`).join("\n") || "none yet";
  return `You are "Cô Linh", an expert English teacher writing ONE lesson of a 360-day course for a Vietnamese adult learner.
LEARNER: CEFR level ${P.level}${diff}. Goal: ${P.goal}. Field of work: ${P.field || "not specified"}. Study time: about ${P.minutes} minutes per day.
Focus areas from the placement test: ${(P.focus||[]).join(", ") || "none"}.
Recent mistakes:
${mist}
COURSE POSITION: Day ${p.day}/360. Month ${p.m}: "${p.M.en}". Week topic: "${p.sub_en}". Grammar focus this week: "${p.grammar}". Week goal: ${p.can}
TODAY: ${typeSpec(p)}
RULES:
- English content pitched at ${P.level}, slightly challenging. Use realistic situations, including the learner's field of work where natural.
- Explanations, meanings and feedback in Vietnamese. IPA in American English between slashes.
- Every objective question has exactly one clearly correct answer; for "fill" list every acceptable answer.
- "order": words of ONE sentence, shuffled, punctuation attached to its word.
- Keep the whole JSON under 10000 characters.
${SCHEMA}`;
}
function cleanLesson(L){
  if (!L || !Array.isArray(L.blocks)) throw {code:"invalid_json"};
  const blocks = L.blocks.filter(b => {
    if (!b || typeof b !== "object") return false;
    if (b.kind !== "q") return ["note","vocab","reading","listening","pron"].includes(b.kind);
    if (!SKILLS[b.skill]) b.skill = b.type === "dict" ? "listening" : b.type === "write" ? "writing" : b.type === "speak" ? "speaking" : "grammar";
    switch (b.type){
      case "mcq": return Array.isArray(b.opts) && b.opts.length >= 2 && Number.isInteger(b.ans) && b.ans >= 0 && b.ans < b.opts.length;
      case "fill": b.ans = [].concat(b.ans || []).map(String).filter(Boolean); return !!b.q && b.ans.length > 0;
      case "order": return Array.isArray(b.words) && b.words.length > 1 && !!b.ans;
      case "dict": return !!b.text;
      case "write": case "speak": return !!b.q;
      default: return false;
    }
  });
  if (!blocks.some(b => b.kind === "q")) throw {code:"invalid_json"};
  return {title:String(L.title||""), goal_vi:String(L.goal_vi||""), blocks};
}
async function generate(p, statusEl){
  if (STATIC){ const d = await fetchJSON(dayKey(p.day) + ".json"); return cleanLesson(d.lesson || d); }
  const raw = await AI.json(lessonPrompt(p), {onText:({text}) => { if (statusEl) statusEl.textContent = "Cô Linh đang soạn bài… (" + text.length.toLocaleString("vi-VN") + " ký tự)"; }});
  return cleanLesson(raw);
}

async function openDay(n, review){
  const p = plan(n), key = dayKey(n);
  S.lesson = null; S.view = "lesson"; setHash("lesson");
  renderNav();
  const status = h("div", null, "Đang mở bài ngày " + n + "…");
  mount(h("div",{class:"loading"}, h("span",{class:"spinner"}), status));
  let doc = await Store.get(key);
  if (!review && doc?.results && !S.profile?.done?.[n]) doc = null; // left over from a reset roadmap: make a fresh lesson
  if (STATIC && !review && !doc?.results) doc = null; // take the latest posted version
  if (!doc?.lesson){
    if (review){ mount(h("div",{class:"card stack"}, h("p",null,"Không tìm thấy nội dung bài ngày " + n + "."), h("div",{class:"row"}, h("button",{class:"btn",onclick:() => go("today")},"Về trang chính")))); return; }
    try {
      status.textContent = (STATIC ? "Đang tải bài ngày " : "Cô Linh đang soạn bài ngày ") + n + "…";
      const lesson = await generate(p, status);
      doc = {day:n, type:p.type, createdAt:new Date().toISOString(), lesson};
      await Store.set(key, doc);
    } catch (e){
      mount(h("div",{class:"card stack"}, h("h2",null,"Chưa soạn được bài"), h("p",null, errText(e)),
        h("div",{class:"row"}, h("button",{class:"btn",onclick:() => openDay(n)},"Thử lại"), h("button",{class:"btn ghost",onclick:() => go("today")},"Về trang chính"))));
      return;
    }
  }
  S.lesson = {kind:"day", key, n, p, doc, lesson:doc.lesson, answers:doc.answers || lsGet("draft:"+key) || {}, results:doc.results || null, score:doc.score, skills:doc.skills, plays:{}};
  renderLesson();
}

/* ============================== LESSON RENDER ============================== */
let draftT;
function saveDraft(){ clearTimeout(draftT); draftT = setTimeout(() => { if (S.lesson && !S.lesson.results) lsSet("draft:"+S.lesson.key, S.lesson.answers); }, 400); }

function renderLesson(){
  const L = S.lesson; if (!L) return go("today");
  const done = !!L.results, blocks = L.lesson.blocks;
  const nodes = [];
  const head = h("div",{class:"lesson-head"});
  if (L.kind === "day"){
    head.append(h("div",{class:"row"}, h("button",{class:"btn quiet sm",onclick:() => go("today")},"← Trang chính"),
      h("span",{class:"chip accent"},"Ngày " + L.n), h("span",{class:"chip"}, TYPES[L.p.type].vi), h("span",{class:"chip"}, "Tuần " + L.p.weekNo + " · " + L.p.sub_vi)));
  } else head.append(h("div",{class:"row"}, h("button",{class:"btn quiet sm",onclick:() => go("today")},"← Trang chính"), h("span",{class:"chip mark"}, L.kind === "placement" ? "Kiểm tra trình độ" : "Bài luyện thêm")));
  head.append(h("h1",null, L.lesson.title || "Bài học"));
  if (L.lesson.goal_vi) head.append(h("p",{class:"muted"}, L.lesson.goal_vi));
  nodes.push(head);
  if (done) nodes.push(resultSummary(L));

  let qn = 0;
  blocks.forEach((b, i) => {
    if (b.after && !done) return;
    if (b.kind === "q"){ qn++; nodes.push(renderQ(b, i, qn, done)); }
    else nodes.push(renderBlock(b, i, done));
  });

  if (!done){
    const total = blocks.filter(b => b.kind === "q").length;
    const count = h("div",{class:"small muted"});
    const upd = () => { const a = Object.keys(L.answers).filter(k => { const v = L.answers[k]; return Array.isArray(v) ? v.length : v !== "" && v != null; }).length; count.textContent = "Đã làm " + a + "/" + total + " câu"; };
    L.onAnswer = () => { upd(); saveDraft(); };
    upd();
    const btn = h("button",{class:"btn",id:"submitBtn",onclick:() => submitLesson(btn)},"Nộp bài");
    nodes.push(h("div",{class:"submitbar"}, h("div",{class:"grow"}, h("b",null,"Nộp bài để chấm điểm"), count), btn));
  } else {
    nodes.push(h("div",{class:"row"}, h("button",{class:"btn",onclick:() => go("today")},"Về trang chính"),
      L.kind === "day" ? h("button",{class:"btn ghost",onclick:() => go("progress")},"Xem tiến độ") : null));
  }
  mount(nodes);
}

function renderBlock(b, i, done){
  switch (b.kind){
    case "note": {
      const el = h("div",{class:"note" + (b.sec ? " sec" : "")});
      if (b.title) el.append(h(b.sec ? "h2" : "h3", null, b.title));
      if (b.text_vi) el.append(h("p",{style:b.title ? "margin-top:6px" : null}, rich(b.text_vi)));
      if (Array.isArray(b.examples) && b.examples.length){
        const ex = h("div",{style:"margin-top:8px"});
        b.examples.forEach(e => ex.append(h("div",{class:"ex"}, h("div",{class:"row",style:"gap:6px;align-items:flex-start;flex-wrap:nowrap"}, sayBtn(e.en), h("span",{style:"min-width:0"}, rich(e.en))), e.vi ? h("div",{class:"vi"}, e.vi) : null)));
        el.append(ex);
      }
      return el;
    }
    case "vocab": return vocabBlock(b.words || []);
    case "reading": return h("article",{class:"reading"}, b.title ? h("h3",{style:"margin-bottom:10px"}, b.title) : null, String(b.text||"").split(/\n\s*\n/).map(p => h("p",null,p)));
    case "listening": return listeningBlock(b, i, done);
    case "pron": return pronBlock(b.items || []);
  }
  return h("div");
}
function sayBtn(text, label="Nghe", rate){
  if (!Voice.ok()) return null;
  return h("button",{type:"button",class:"btn ghost sm","aria-label":"Nghe: " + text,onclick:() => Voice.say(text, rate)}, label);
}
function vocabBlock(list){
  const grid = h("div",{class:"vgrid"});
  list.forEach(w => {
    const card = h("div",{class:"vcard"},
      h("div",{class:"w"}, h("b",null,w.w), w.pos ? h("span",{class:"pos"},w.pos) : null, w.ipa ? h("span",{class:"ipa"},w.ipa) : null),
      h("div",{class:"mean"}, w.vi || ""),
      w.ex ? h("div",null, rich(w.ex)) : null,
      w.ex_vi ? h("div",{class:"small muted exvi"}, w.ex_vi) : null,
      Array.isArray(w.col) && w.col.length ? h("div",{class:"col"}, w.col.map(c => h("span",null,c))) : null,
      w.use_vi ? h("div",{class:"small muted"}, w.use_vi) : null,
      h("div",{class:"row",style:"gap:6px"}, sayBtn(w.w), w.ex ? sayBtn(w.ex, "Câu ví dụ") : null));
    card.addEventListener("click", e => { if (e.target.closest(".mean,.exvi")) card.classList.add("peek"); });
    grid.append(card);
  });
  const toggle = h("button",{type:"button",class:"btn quiet sm",onclick:() => { wrap.classList.toggle("hide-mean"); toggle.textContent = wrap.classList.contains("hide-mean") ? "Hiện nghĩa" : "Che nghĩa để tự kiểm tra"; }},"Che nghĩa để tự kiểm tra");
  const wrap = h("div",{class:"block"}, h("div",{class:"row",style:"justify-content:space-between"}, h("h3",null, list.length + " từ vựng"), toggle), grid);
  return wrap;
}
function listeningBlock(b, i, done){
  const L = S.lesson, max = b.plays || 0;
  const used = () => L.plays[i] || 0;
  const cnt = h("span",{class:"small muted"});
  const upd = () => { cnt.textContent = max ? "Đã nghe " + used() + "/" + max + " lần" : (used() ? "Đã nghe " + used() + " lần" : ""); };
  const play = (rate) => {
    if (!done && max && used() >= max) return toast("Đã hết lượt nghe đoạn này.");
    L.plays[i] = used() + 1; if (L.kind === "placement") lsSet("plays:placement", L.plays); upd();
    if (max && used() >= max && !done) { playBtn.disabled = true; slowBtn.disabled = true; }
    Voice.say(scriptLines(b.script), rate);
  };
  const playBtn = h("button",{type:"button",class:"btn sm",onclick:() => play()},"Nghe");
  const slowBtn = h("button",{type:"button",class:"btn ghost sm",onclick:() => play(0.8)},"Nghe chậm");
  if (!done && max && used() >= max){ playBtn.disabled = true; slowBtn.disabled = true; }
  upd();
  const el = h("div",{class:"block"},
    h("div",{class:"player"}, h("b",{style:"margin-right:auto"}, b.title || "Bài nghe"), playBtn, slowBtn, h("button",{type:"button",class:"btn quiet sm",onclick:() => Voice.stop()},"Dừng"), cnt));
  if (!Voice.ok()) el.append(h("p",{class:"small muted"},"Thiết bị không phát được âm thanh. Lời thoại hiện bên dưới."));
  if (done || !Voice.ok()) el.append(h("div",{class:"script"}, b.script));
  return el;
}
function pronBlock(items){
  return h("div",{class:"block"}, h("h3",null,"Luyện phát âm"),
    !Mic.d ? h("p",{class:"small muted"},"Muốn được chấm phát âm, hãy mở app bằng Chrome/Edge hoặc app Claude trên máy tính. Trên điện thoại bạn vẫn nghe mẫu và đọc theo được.") : null,
    items.map(it => {
      const out = h("div");
      const live = h("div",{class:"live-txt"});
      let said = "";

async function gradeOpen(items, level){
  const tasks = items.map(({i,b,a}) => `[id ${i}] (${b.type === "write" ? "writing" + (b.min ? ", min " + b.min + " words" : "") : "speaking, typed or transcribed from speech: ignore punctuation and capitals"})\nTask: ${b.q}\nAnswer: """${String(a).slice(0,3000)}"""`).join("\n\n");
  const out = await AI.json(`You are "Cô Linh", an encouraging but precise English teacher grading a Vietnamese learner (CEFR ${level}).
Grade each answer 0-10 for task completion, grammar, vocabulary and coherence/naturalness. List the real errors (max 8 per answer).
Return only a JSON array: [{"i":<id>,"score":<0-10>,"errors":[{"wrong":"exact fragment","right":"correction","why_vi":"giải thích ngắn"}],"better":"a natural corrected version, slightly above the learner's level","comment_vi":"1-2 câu: điểm tốt và điều cần cải thiện"}]

${tasks}`);
  return Array.isArray(out) ? out : (out?.results || []);

function aggregate(blocks, results){

    const w = (b.type === "write" || b.type === "speak") && !r.self ? 2 : 1;

    (sk[b.skill] ||= [0,0]); sk[b.skill][0] += r.score*w; sk[b.skill][1] += w;

  return {score: wsum ? Math.round(100*sum/wsum) : 0, skills};
}
async function submitLesson(btn){
  const L = S.lesson, blocks = L.lesson.blocks;
  const total = blocks.filter(b => b.kind === "q").length;
  const answered = Object.keys(L.answers).length;
  if (answered < total && !btn.dataset.sure){
    btn.dataset.sure = "1"; btn.textContent = "Vẫn nộp (" + (total-answered) + " câu trống)";
    return;
  }
  Mic.d && Mic.active && Mic.d.stop().catch(() => {});
  Voice.stop();
  btn.disabled = true; btn.replaceChildren(h("span",{class:"spinner"}), " Đang chấm…");
  const results = {}, open = [];
  blocks.forEach((b,i) => {
    if (b.kind !== "q") return;
    const a = L.answers[i];
    if (b.type === "mcq") results[i] = {score: a === b.ans ? 1 : 0};
    else if (b.type === "fill") results[i] = {score: matchAny(a, b.ans) ? 1 : 0};
    else if (b.type === "order") results[i] = {score: Array.isArray(a) && norm(a.map(k => b.words[k]).join(" ")) === norm(b.ans) ? 1 : 0};
    else if (b.type === "dict") results[i] = {score: a ? Math.round(compareText(b.text, a).score*100)/100 : 0};
    else if (!a || !String(a).trim()) results[i] = {score:0, empty:true};
    else open.push(i);
  });
  const level = S.profile?.level || "unknown (placement test)";
  if (open.length && !AI.s){
    open.splice(0).forEach(i => { const b = blocks[i], wc = wordCount(L.answers[i]);
      results[i] = {self:true, wc, score: L.kind === "placement" ? null : Math.min(1, wc / (b.type === "write" ? (b.min || 60) : 30))}; });
  }
  if (open.length){
    try {
      const fb = await gradeOpen(open.map(i => ({i, b:blocks[i], a:L.answers[i]})), level);
      open.forEach(i => { const f = fb.find(x => Number(x.i) === i); results[i] = f ? {score: clamp(Number(f.score)||0,0,10)/10, fb:{...f, score:clamp(Number(f.score)||0,0,10)}} : {score:null, error:"Chưa chấm được câu này."}; });
    } catch (e){
      open.forEach(i => results[i] = {score:null, error:"Chưa chấm được phần viết/nói: " + errText(e)});
    }
  }

  L.results = results; L.score = score; L.skills = skills;

  else if (L.kind === "day") await finishDay(L);
  renderLesson(); window.scrollTo(0,0);
}
function collectMistakes(L, day){

    if (b.type === "mcq") out.push({d:day, t:b.skill, q:String(b.q).slice(0,120), a:b.opts[b.ans]});
    else if (b.type === "fill") out.push({d:day, t:b.skill, q:String(b.q).slice(0,120), a:b.ans[0]});

Return only JSON: {"words":[{"w":"word","ipa":"/US IPA/","pos":"n.|v.|adj.|adv.|phr.","vi":"nghĩa","ex":"example","ex_vi":"dịch","col":["2-3 collocations"],"use_vi":"cách dùng khi giao tiếp (ngắn)"}]}`);
        out.replaceChildren(vocabBlock((r.words||[]).slice(0,30)));
      } else {
        const r = await AI.json(`Create 8 English sentences about "${t}" for pronunciation practice by a Vietnamese learner at CEFR ${lvl}, targeting sounds and patterns Vietnamese speakers find hard (final consonants, /θ ð/, /ʃ ʒ/, /r l/, clusters, word stress, linking, intonation).
Return only JSON: {"items":[{"s":"sentence","ipa":"/US IPA of the sentence/","stress":"sentence with STRESSED syllables in capitals","tone":"ngữ điệu (lên/xuống ở đâu)","pitfalls_vi":"âm dễ phát âm sai","tip_vi":"mẹo luyện tập"}]}`);
        out.replaceChildren(pronBlock(r.items||[]));
      }
    })}, isV ? "Tạo 30 từ" : "Tạo bài phát âm");
    form = h("div",{class:"card stack"}, h("div",{class:"row",style:"align-items:flex-end"}, h("label",{class:"field"},"Chủ đề", topic), btn),
      h("p",{class:"small muted"}, isV ? "Mỗi từ có nghĩa, phiên âm, ví dụ, cụm từ thường đi cùng và cách dùng khi giao tiếp." : "Mỗi câu có phiên âm, trọng âm, ngữ điệu, âm dễ sai và mẹo luyện. Bấm Đọc thử để máy nghe và chấm."));
  }
  mount(h("div",{class:"stack",style:"gap:6px"}, h("div",{class:"eyebrow"},"Luyện thêm"), h("h1",null,"Công cụ luyện tập tự do")), seg, form, out);
}
function copyBtn(text){
  return h("button",{type:"button",class:"btn quiet sm",onclick:e => { const b = e.currentTarget; navigator.clipboard.writeText(text).then(() => { b.textContent = "Đã chép"; }, () => toast("Không chép được, hãy bôi đen và sao chép thủ công.")); }},"Chép");
}

/* ============================== LEARNERS (profiles on this device / account) ============================== */
const learnerName = id => S.learners.find(l => l.id === id)?.name || "Người học";
async function saveLearners(){ await Store.set("learners", S.learners); showWho(); }
function showWho(){ const b = $("#who"); if (!b) return; b.hidden = !S.learners.length; b.textContent = "👤 " + learnerName(S.learner); b.title = "Đổi hoặc quản lý người học"; }
async function useLearner(id){
  Voice.stop(); S.learner = id; lsSet("learner", id); S.lesson = null; S.chat = null;
  S.profile = await Store.get("profile"); showWho(); go("today");
}
async function addLearner(name){
  const id = "u" + Date.now().toString(36);
  S.learners.push({id, name, created:today()}); await saveLearners(); await useLearner(id);
}
async function removeLearner(id){
  const prev = S.learner; S.learner = id;
  if (Store.mode === "cloud") for (const k of ["profile","placement-result"]) await Store.ref(k).delete().catch(() => {});
  try { Object.keys(localStorage).filter(k => k.startsWith("l360:") && (id === "main" ? !k.includes("__") && !GLOBAL_KEYS.has(k.slice(5)) : k.startsWith("l360:" + id + "__"))).forEach(k => localStorage.removeItem(k)); } catch {}
  S.learner = prev; S.learners = S.learners.filter(l => l.id !== id); await saveLearners();
}
async function renderLearners(){
  mount(loadingView("Đang mở danh sách người học…"));
  const rows = [];
  for (const L of S.learners){
    const prev = S.learner; S.learner = L.id; const P = await Store.get("profile"); S.learner = prev;
    const info = P ? progressInfo(P) : null, d = P ? Object.keys(P.done||{}).map(Number) : [];
    const a = P ? avg(d.slice(-30).map(n => P.done[n].s)) : null;
    const conf = h("div",{class:"confirm",hidden:true}, h("b",null,"Xóa " + L.name + " và toàn bộ tiến độ?"), h("p",{class:"small"},"Không hoàn tác được. Hãy Sao lưu trước nếu cần."),
      h("div",{class:"row"}, h("button",{class:"btn danger sm",onclick:async () => { await removeLearner(L.id); renderLearners(); }},"Xóa"), h("button",{class:"btn quiet sm",onclick:() => conf.hidden = true},"Hủy")));
    rows.push(h("div",{class:"card stack"},
      h("div",{class:"row",style:"justify-content:space-between"}, h("h3",null, L.name, L.id === S.learner ? h("span",{class:"chip accent",style:"margin-left:8px"},"Đang học") : null),
        h("span",{class:"muted small"}, "Tạo " + fmtVN(L.created || today()))),
      P ? h("div",{class:"chips"}, h("span",{class:"chip"},"Trình độ " + P.level), h("span",{class:"chip"}, info.doneN + "/360 bài"), h("span",{class:"chip"},"TB " + (a == null ? "–" : Math.round(a) + "%")),
          h("span",{class:"chip"}, P.lastDate ? "Học gần nhất " + fmtVN(P.lastDate) : "Chưa học bài nào"))
        : h("p",{class:"small muted"},"Chưa bắt đầu: cần làm bài kiểm tra trình độ hoặc tự chọn trình độ."),
      h("div",{class:"row"}, L.id === S.learner ? null : h("button",{class:"btn sm",onclick:() => useLearner(L.id)},"Học với hồ sơ này"),
        h("button",{class:"btn ghost sm",onclick:async () => { const n = prompt("Tên mới", L.name); if (n && n.trim()){ L.name = n.trim().slice(0,40); await saveLearners(); renderLearners(); } }},"Đổi tên"),
        S.learners.length > 1 ? h("button",{class:"btn quiet sm",onclick:() => conf.hidden = false},"Xóa") : null),
      conf));
  }
  const name = h("input",{type:"text",id:"newLearner",placeholder:"Tên người học, ví dụ: Lan",maxlength:"40"});
  mount(h("div",{class:"stack",style:"gap:6px"}, h("div",{class:"eyebrow"},"Quản lý"), h("h1",null,"Người học")),
    h("p",{class:"muted"},"Mỗi người có lộ trình, điểm số và trình độ riêng. Tất cả học chung bộ bài cô Linh đăng mỗi ngày."),
    rows,
    h("div",{class:"card stack"}, h("h3",null,"Thêm người học"), h("label",{class:"field"},"Tên", name),
      h("div",{class:"row"}, h("button",{class:"btn",onclick:() => { const n = name.value.trim(); if (!n) return toast("Nhập tên người học."); addLearner(n.slice(0,40)); }},"Thêm và bắt đầu học"))));
}

/* ============================== BACKUP (move progress between accounts) ============================== */
const BK_APP = "lo-trinh-360";
function mergeProfiles(a, b){
  if (!a) return b; if (!b) return a;
  const n = x => Object.keys(x.done||{}).length;
  const la = a.lastDate || "", lb = b.lastDate || "";
  const newer = lb > la || (lb === la && n(b) > n(a)) ? b : a, older = newer === a ? b : a;
  const uniq = (arr, key) => { const seen = new Set(); return arr.filter(x => { const k = key(x); if (seen.has(k)) return false; seen.add(k); return true; }); };
  const starts = [a.startDate, b.startDate].filter(Boolean).sort();
  return {...newer,
    startDate: starts[0] || newer.startDate,
    done: {...(older.done||{}), ...(newer.done||{})},
    mistakes: uniq([...(older.mistakes||[]), ...(newer.mistakes||[])], m => m.d + "|" + m.q + "|" + m.a).slice(-40),
    levelHistory: uniq([...(older.levelHistory||[]), ...(newer.levelHistory||[])], x => x.d + "|" + x.l + "|" + x.why).sort((x,y) => String(x.d).localeCompare(String(y.d))),
    placement: newer.placement || older.placement || null,
    focus: (newer.focus && newer.focus.length) ? newer.focus : (older.focus || [])};
}
async function buildBackup(){
  let placement = null; try { placement = await Store.get("placement-result"); } catch {}
  return {app:BK_APP, v:1, exportedAt:new Date().toISOString(), profile:S.profile, placement};
}
function parseBackup(text){
  let o; try { o = JSON.parse(String(text||"").trim()); } catch { throw new Error("Mã sao lưu không đọc được. Hãy dán đủ toàn bộ nội dung."); }
  if (!o || o.app !== BK_APP || !o.profile || typeof o.profile.done !== "object") throw new Error("Đây không phải bản sao lưu của Lộ trình tiếng Anh 360.");
  return o;
}
async function restoreBackup(text){
  const o = parseBackup(text);
  const merged = mergeProfiles(S.profile, o.profile);
  await Store.set("profile", merged);
  if (o.placement){ let cur = null; try { cur = await Store.get("placement-result"); } catch {} if (!cur) await Store.set("placement-result", o.placement); }
  S.profile = merged;
  return Object.keys(merged.done||{}).length;
}
function backupCard(restoreOnly){
  const msg = h("p",{class:"small",hidden:true,role:"status"});
  const say = t => { msg.textContent = t; msg.hidden = false; };
  const codeOut = h("textarea",{readonly:true,style:"min-height:90px;font-size:12px","aria-label":"Mã sao lưu"});
  const outBox = h("div",{class:"stack",hidden:true,style:"gap:8px"},
    h("p",{class:"small muted"},"Nếu không lưu được tệp: bấm Chép rồi dán mã này vào app ở tài khoản kia (mục Khôi phục)."),
    codeOut, h("div",{class:"row"}, h("button",{type:"button",class:"btn quiet sm",onclick:e => { const b = e.currentTarget; codeOut.select(); navigator.clipboard?.writeText(codeOut.value).then(() => { b.textContent = "Đã chép"; }, () => { try { document.execCommand("copy"); b.textContent = "Đã chép"; } catch { toast("Hãy bôi đen mã rồi sao chép thủ công."); } }); }},"Chép mã")));
  const doExport = async () => {
    const text = JSON.stringify(await buildBackup());
    codeOut.value = text; outBox.hidden = false;
    const dl = window.claude?.use ? await claude.use("downloads").catch(() => null) : null;
    if (!dl && STATIC){ const a = h("a",{href:URL.createObjectURL(new Blob([text],{type:"application/json"})), download:"lo-trinh-360_sao-luu_" + today() + ".json"}); a.click(); say("Đã tải tệp sao lưu. Ở máy kia: Tiến độ → Khôi phục và chọn tệp này."); return; }
    if (!dl){ say("Đã tạo mã sao lưu bên dưới."); return; }
    try { await dl.save({filename:"lo-trinh-360_sao-luu_" + today() + ".json", data:text}); say("Đã lưu tệp sao lưu. Mở app ở tài khoản kia, vào Tiến độ → Khôi phục và chọn tệp này."); }
    catch (e){ say(e?.code === "declined" ? "Bạn chưa lưu tệp. Có thể dùng mã sao lưu bên dưới." : "Không lưu được tệp ở đây. Hãy dùng mã sao lưu bên dưới."); }
  };
  const paste = h("textarea",{placeholder:"Dán mã sao lưu vào đây…",style:"min-height:90px;font-size:12px","aria-label":"Dán mã sao lưu"});
  const file = h("input",{type:"file",accept:".json,application/json,text/plain",hidden:true,onchange:async e => { const f = e.target.files?.[0]; if (f){ paste.value = await f.text(); say("Đã đọc tệp " + f.name + ". Bấm Khôi phục để gộp tiến độ."); } }});
  const doRestore = async () => {
    try { const n = await restoreBackup(paste.value); paste.value = ""; toast("Đã khôi phục: " + n + " ngày đã học."); go("today"); }
    catch (e){ say(e.message || String(e)); }
  };
  const inBox = h("div",{class:"stack",hidden:!restoreOnly ? true : null,style:"gap:8px"},
    h("p",{class:"small muted"},"Chọn tệp sao lưu (.json) hoặc dán mã sao lưu. Tiến độ được gộp với dữ liệu đang có: bài đã học ở cả hai bên đều được giữ."),
    h("div",{class:"row"}, h("button",{type:"button",class:"btn quiet sm",onclick:() => file.click()},"Chọn tệp sao lưu…"), file),
    paste, h("div",{class:"row"}, h("button",{type:"button",class:"btn sm",onclick:doRestore},"Khôi phục tiến độ")));
  return h("div",{class:"card stack"},
    h("h3",null, restoreOnly ? "Đã học ở " + (STATIC ? "máy" : "tài khoản") + " khác?" : STATIC ? "Chuyển tiến độ sang máy khác" : "Chuyển tiến độ giữa 2 tài khoản"),
    restoreOnly ? h("p",{class:"small muted"},"Khôi phục bản sao lưu để học tiếp, không cần làm lại bài kiểm tra.")
      : h("p",{class:"small muted"},"Trước khi đổi tài khoản: bấm Sao lưu. Sang tài khoản kia: mở app, vào Tiến độ → Khôi phục."),
    restoreOnly ? null : h("div",{class:"row"}, h("button",{type:"button",class:"btn sm",onclick:doExport},"Sao lưu tiến độ"),
      h("button",{type:"button",class:"btn ghost sm",onclick:() => inBox.hidden = !inBox.hidden},"Khôi phục")),
    outBox, inBox, msg);
}

/* ============================== BOOT ============================== */
async function boot(){
  window.addEventListener("hashchange", route);
  await Promise.all([Store.init(), AI.init(), Voice.init(), Mic.init()]);
  await loadPublished();
  $("#sync").textContent = Store.mode === "cloud" ? "Đã đồng bộ" : "Lưu trên máy";
  $("#sync").title = Store.mode === "cloud" ? "Tiến độ lưu vào tài khoản Claude, dùng được trên mọi thiết bị" : "Mở trên claude.ai khi đã đăng nhập để đồng bộ giữa các thiết bị";
  S.learners = (await Store.get("learners")) || [];
  const last = lsGet("learner");
  S.learner = S.learners.some(l => l.id === last) ? last : (S.learners[0]?.id || "main");
  $("#who").onclick = () => go("learners"); showWho();
  S.profile = await Store.get("profile");
  route();
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState !== "visible" || S.view === "lesson" || S.view === "chat") return;
    await loadPublished();
    const p = await Store.get("profile"); if (p){ S.profile = p; render(); }
  });
}
boot();
</script>
